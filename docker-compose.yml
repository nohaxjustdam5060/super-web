version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: super_postgres_db
    restart: always
    environment:
      POSTGRES_DB: super_ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: super_express_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/super_ecommerce_db
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: super_secret_jwt_key_tech_ecommerce_2026_change_in_prod
      REFRESH_TOKEN_SECRET: super_secret_refresh_key_tech_ecommerce_2026
    depends_on:
      - postgres

volumes:
  postgres_data:
